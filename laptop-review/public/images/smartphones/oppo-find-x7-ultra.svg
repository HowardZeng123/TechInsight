<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="oppoTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="oppoLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>

  <!-- Body -->
  <rect x="110" y="30" width="180" height="430" rx="28" ry="28" fill="#D97706"/>
  
  <!-- Dual Tone split: Top Silver Metal, Bottom Brown Leather -->
  <rect x="114" y="34" width="172" height="170" rx="24" ry="24" fill="url(#oppoTop)"/>
  <rect x="114" y="180" width="172" height="276" rx="24" ry="24" fill="url(#oppoLeather)"/>

  <!-- Massive Circular Camera Module -->
  <circle cx="200" cy="150" r="65" fill="#18181B" stroke="#CBD5E1" stroke-width="4"/>
  
  <!-- 4 Camera Lenses -->
  <circle cx="175" cy="130" r="14" fill="#090A0F" stroke="#3F3F46" stroke-width="2"/>
  <circle cx="225" cy="130" r="14" fill="#090A0F" stroke="#3F3F46" stroke-width="2"/>
  <circle cx="175" cy="170" r="14" fill="#090A0F" stroke="#3F3F46" stroke-width="2"/>
  <circle cx="225" cy="170" r="14" fill="#090A0F" stroke="#3F3F46" stroke-width="2"/>

  <!-- Hasselblad "H" Logo -->
  <text x="200" y="154" font-family="serif" font-size="14" font-weight="bold" fill="#E4E4E7" text-anchor="middle">H</text>

  <!-- OPPO Logo at bottom -->
  <text x="200" y="420" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FDE68A" text-anchor="middle" letter-spacing="3">OPPO</text>

  <!-- Badge -->
  <rect x="130" y="465" width="140" height="20" rx="10" fill="#451A03"/>
  <text x="200" y="479" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FBBF24" text-anchor="middle">Find X7 Ultra</text>
</svg>