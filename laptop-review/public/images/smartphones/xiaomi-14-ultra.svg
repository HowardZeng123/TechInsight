<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="miBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="miDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="85%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </radialGradient>
  </defs>

  <!-- Phone Body -->
  <rect x="110" y="30" width="180" height="430" rx="28" ry="28" fill="#D4AF37"/>
  <rect x="114" y="34" width="172" height="422" rx="24" ry="24" fill="url(#miBack)"/>

  <!-- Leather texture simulation lines -->
  <line x1="114" y1="200" x2="286" y2="200" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Huge Leica Camera Circle -->
  <circle cx="200" cy="150" r="68" fill="url(#miDisc)" stroke="#D4AF37" stroke-width="3"/>
  <circle cx="200" cy="150" r="62" fill="#111111" stroke="#222" stroke-width="2"/>

  <!-- 4 Lenses -->
  <!-- Top Main 1-inch -->
  <circle cx="200" cy="118" r="15" fill="#050505" stroke="#444" stroke-width="2"/>
  <circle cx="200" cy="118" r="7" fill="#1d4ed8" opacity="0.7"/>

  <!-- Bottom Periscope -->
  <circle cx="200" cy="182" r="15" fill="#050505" stroke="#444" stroke-width="2"/>
  <rect x="194" y="176" width="12" height="12" fill="#000" stroke="#666"/>

  <!-- Left Telephoto -->
  <circle cx="168" cy="150" r="14" fill="#050505" stroke="#444" stroke-width="2"/>
  <circle cx="168" cy="150" r="6" fill="#1d4ed8" opacity="0.7"/>

  <!-- Right Ultra Wide -->
  <circle cx="232" cy="150" r="14" fill="#050505" stroke="#444" stroke-width="2"/>
  <circle cx="232" cy="150" r="6" fill="#1d4ed8" opacity="0.7"/>

  <!-- Leica Red Logo Center Text -->
  <rect x="186" y="145" width="28" height="10" rx="2" fill="#DC2626"/>
  <text x="200" y="153" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFF" text-anchor="middle">LEICA</text>

  <!-- Xiaomi Logo at bottom -->
  <text x="200" y="420" font-family="sans-serif" font-size="12" font-weight="bold" fill="#888" text-anchor="middle" letter-spacing="2">Xiaomi</text>

  <!-- Badge -->
  <rect x="140" y="465" width="120" height="20" rx="10" fill="#18181B"/>
  <text x="200" y="479" font-family="sans-serif" font-size="10" font-weight="bold" fill="#EF4444" text-anchor="middle">Xiaomi 14 Ultra</text>
</svg>