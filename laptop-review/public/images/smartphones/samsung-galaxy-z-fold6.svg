<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="foldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="foldScreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Opened Main Tablet Screen -->
  <rect x="40" y="50" width="320" height="390" rx="16" ry="16" fill="url(#foldFrame)"/>
  <rect x="46" y="56" width="308" height="378" rx="12" ry="12" fill="url(#foldScreen)"/>

  <!-- Center Hinge Line -->
  <line x1="200" y1="56" x2="200" y2="434" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <line x1="200" y1="56" x2="200" y2="434" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>

  <!-- Under Display Camera Right Side -->
  <circle cx="280" cy="76" r="3" fill="rgba(255,255,255,0.2)"/>

  <!-- Futuristic Dual Screen Wallpaper Art -->
  <path d="M 60 300 Q 130 150 200 300 T 340 300" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.6"/>
  <path d="M 60 320 Q 130 170 200 320 T 340 320" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.5"/>

  <!-- Badge -->
  <rect x="130" y="465" width="140" height="20" rx="10" fill="#0F172A"/>
  <text x="200" y="479" font-family="sans-serif" font-size="10" font-weight="bold" fill="#38BDF8" text-anchor="middle">Galaxy Z Fold6</text>
</svg>